name: Auto release

# Triggers on every push to master. Skips its own version-bump commits to
# prevent an infinite loop.
on:
  push:
    branches: [master]

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # push version-bump commit + tag, create GitHub Release
      id-token: write  # OIDC trusted publishing to PyPI

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev deps
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/unit/ -v

      - name: Bump patch version
        id: version
        run: |
          python - << 'PYEOF'
          import re, os
          content = open("pyproject.toml").read()
          m = re.search(r'(version = ")(\d+\.\d+\.)(\d+)(")', content)
          new_ver = m.group(2) + str(int(m.group(3)) + 1)
          new_content = re.sub(
              r'(version = ")\d+\.\d+\.\d+(")',
              rf'\g<1>{new_ver}\2',
              content, count=1,
          )
          open("pyproject.toml", "w").write(new_content)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={new_ver}\n")
          print(f"Bumped to {new_ver}")
          PYEOF

      - name: Install build tools
        run: pip install hatchling build

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Commit version bump, tag, and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin master
          git push origin "v${{ steps.version.outputs.version }}"
          gh release create "v${{ steps.version.outputs.version }}" dist/* \
            --title "vocametrix ${{ steps.version.outputs.version }}" \
            --generate-notes
